<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Mapping 配置平台</title>
<link rel="stylesheet" href="style.css?v=20260319">
</head>
<body>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="tb-logo">
    <img src="logo.png" alt="Token Mapping" style="width:22px;height:22px;border-radius:5px;">
    Token Mapping
  </div>
  <div class="tb-sep"></div>
  <!-- Project navigation (shown only inside a project) -->
  <div class="tb-project-nav" id="tb-project-nav" style="display:none">
    <button class="btn tb-back-btn" onclick="backToProjects()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" style="width:12px;height:12px"><polyline points="10,3 5,8 10,13"/></svg>
      项目列表
    </button>
    <div class="tb-sep"></div>
    <span class="tb-project-name" id="tb-project-name" title="点击重命名" onclick="startRenameProject()"></span>
  </div>
  <div class="tb-right">
    <div class="tb-user" id="tb-user" style="display:none">
      <img class="tb-avatar" id="tb-avatar" alt="" style="display:none" onerror="this.style.display='none';document.getElementById('tb-avatar-ph').style.display='flex'">
      <div class="tb-avatar-placeholder" id="tb-avatar-ph" style="display:none"></div>
      <span class="tb-username" id="tb-username"></span>
      <button class="btn" onclick="logout()">退出</button>
    </div>
    <div class="tb-sep" id="tb-sep-user" style="display:none"></div>
    <div class="export-wrap" id="export-wrap" style="display:none">
      <button class="btn" onclick="openBatchEditor()" title="批量编辑 Variable">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:14px;height:14px">
          <line x1="3" y1="4" x2="13" y2="4"/><line x1="3" y1="8" x2="13" y2="8"/><line x1="3" y1="12" x2="9" y2="12"/>
          <circle cx="13" cy="12" r="2"/><line x1="13" y1="10" x2="13" y2="10.01" stroke-width="0"/>
        </svg>
        批量编辑
      </button>
      <button class="btn" onclick="openImportModal()" title="导入">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:14px;height:14px">
          <!-- 导入：箭头向下落入实心托盘 -->
          <path d="M8 2v8"/><path d="M5 7l3 3 3-3"/>
          <rect x="3" y="12" width="10" height="2" rx="0.5" fill="currentColor" stroke="none"/>
        </svg>
        导入
      </button>
      <button class="btn btn-primary" onclick="doExport()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:14px;height:14px">
          <!-- 导出：分享风格，箭头从盒子右上角飞出 -->
          <path d="M9 3h4v4"/><path d="M13 3l-5 5"/><path d="M12 9v4H4V5h4"/>
        </svg>
        导出
      </button>
    </div>
  </div>
</div>

<!-- FOCUS BANNER -->
<div id="focus-banner">
  <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="flex-shrink:0;opacity:0.7">
    <circle cx="8" cy="8" r="5"/><line x1="8" y1="1" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="15"/>
    <line x1="1" y1="8" x2="3" y2="8"/><line x1="13" y1="8" x2="15" y2="8"/>
  </svg>
  <span class="fb-label">筛选视图：只看 <b id="fb-token-name"></b> 相关</span>
  <button class="fb-exit" onclick="clearFocusToken()">退出筛选 ✕</button>
</div>

<!-- WORKSPACE -->
<div class="workspace" id="workspace">
<div class="layout" id="layout">

  <div id="columns-container" style="display:contents"></div>

  <!-- SVG OVERLAY -->
  <svg id="lines" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0.5 L0,5.5 L6,3 Z" fill-opacity="0.7"/>
      </marker>
    </defs>
  </svg>
</div>
</div>

<!-- CONTEXT MENU -->
<div class="cmenu" id="cmenu">
  <div class="cmenu-item" id="cmenu-focus" style="display:none">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="8" cy="8" r="5"/><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"/>
    </svg>
    只看此 Token 相关
  </div>
  <div class="cmenu-sep" id="cmenu-focus-sep" style="display:none"></div>
  <div class="cmenu-item" id="cmenu-color" style="display:none">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="8" cy="8" r="5"/><circle cx="8" cy="8" r="2" fill="currentColor" stroke="none"/>
    </svg>
    编辑颜色
  </div>
  <div class="cmenu-sep" id="cmenu-color-sep" style="display:none"></div>
  <div class="cmenu-item" id="cmenu-detach" style="display:none">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M4 8h3m5 0h-3"/><circle cx="3" cy="8" r="2"/><circle cx="13" cy="8" r="2"/>
      <line x1="7" y1="5" x2="9" y2="11" stroke-dasharray="2 2"/>
    </svg>
    断开连线
  </div>
  <div class="cmenu-sep" id="cmenu-detach-sep" style="display:none"></div>
  <div class="cmenu-item red" id="cmenu-del">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <polyline points="3 4 4 4 13 4"/><path d="M12 4l-.7 9a1 1 0 01-1 .97H5.7a1 1 0 01-1-.97L4 4"/><path d="M6 4V3a1 1 0 011-1h2a1 1 0 011 1v1"/>
    </svg>
    删除
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-h" id="modal-h">添加</div>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitModal()">确认添加</button>
    </div>
  </div>
</div>

<!-- IMPORT MODAL -->
<div class="modal-bg" id="import-modal-bg">
  <div class="modal" style="width:520px">
    <div class="modal-h">导入 Token</div>
    <div class="field">
      <label style="display:flex;align-items:center;justify-content:space-between">
        <span>粘贴数据</span>
        <span style="font-size:11px;color:var(--text-3);font-weight:400">支持导出的 JSON、Token Studio、CSS Variable</span>
      </label>
      <textarea class="fi" id="import-textarea" rows="9"
        placeholder='// ① JSON 数组（推荐）
// level = Collection 名，name 支持斜杠分组，value 是 #hex 或另一个 variable 名
[
  { "level": "Primitive", "name": "Blue/blue-500", "value": "#3B82F6" },
  { "level": "Semantic",  "name": "Action/primary", "value": "blue-500" }
]

// ② 导出的 JSON / Token Studio / W3C DTCG 嵌套格式直接粘贴即可

// ③ CSS Variable
--blue-500: #3B82F6;
--color-primary: #3B82F6;'
        style="resize:vertical;font-family:monospace;font-size:11.5px;line-height:1.6"></textarea>
    </div>
    <div id="import-preview" style="font-size:12px;color:var(--text-3);min-height:18px;margin-top:-4px"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeImportModal()">取消</button>
      <button class="btn btn-primary" onclick="submitImport()">导入</button>
    </div>
  </div>
</div>

<!-- LEVEL NAME MODAL -->
<div class="modal-bg" id="level-modal-bg">
  <div class="modal">
    <div class="modal-h" id="level-modal-h">新建 Collection</div>
    <div class="field">
      <label>Collection 名称</label>
      <input class="fi" id="level-modal-input" placeholder="例如：Alias" maxlength="40" spellcheck="false" autocomplete="off">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeLevelModal()">取消</button>
      <button class="btn btn-primary" id="level-modal-confirm" onclick="submitLevelModal()">确认</button>
    </div>
  </div>
</div>

<!-- COLOR POPOVER -->
<div id="color-pop">
  <div class="cpop-label">名称</div>
  <input id="cpop-name" class="fi" placeholder="group.token-name" autocomplete="off" spellcheck="false" style="width:100%;box-sizing:border-box;height:30px;font-size:12.5px;margin-bottom:10px">
  <div class="cpop-label">颜色</div>
  <div class="cpop-row">
    <input type="color" id="cpop-pick">
    <input id="cpop-hex" placeholder="#000000" maxlength="9" spellcheck="false" autocomplete="off">
  </div>
  <button class="cpop-save-btn" onclick="saveColorPop()">保存</button>
</div>

<!-- TOKEN PICKER -->
<div id="tpick">
  <div class="tp-head">
    <span class="tp-title" id="tp-title">编辑</span>
    <button class="tp-close" onclick="closePicker()">✕</button>
  </div>

  <!-- Name field -->
  <div class="tp-body-sec" style="padding-bottom:8px">
    <div class="tp-color-lbl">名称</div>
    <input id="tp-name" class="fi" placeholder="group.token-name" autocomplete="off" spellcheck="false"
           style="width:100%;box-sizing:border-box;height:32px">
  </div>

  <!-- Color field -->
  <div class="tp-body-sec">
    <div class="tp-color-lbl">颜色</div>
    <div class="tp-chex-row" style="position:relative">
      <input type="color" id="tp-cpick">
      <input id="tp-chex" class="fi" placeholder="#000000"
             maxlength="9" spellcheck="false" autocomplete="off"
             style="flex:1;min-width:0;height:32px">
      <span id="tp-linked-name" class="tp-linked-name fi-sel" onclick="openTpDropdown()"></span>
      <button class="tp-dd-btn" id="tp-token-dd-btn" onclick="handleTpActionBtn()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
          <circle cx="3.5" cy="3.5" r="1.8"/>
          <circle cx="10.5" cy="3.5" r="1.8"/>
          <circle cx="3.5" cy="10.5" r="1.8"/>
          <circle cx="10.5" cy="10.5" r="1.8"/>
        </svg>
      </button>
      <!-- 关联 token 下拉 -->
      <div class="tp-token-dd" id="tp-token-dd">
        <div style="padding:6px 8px 4px">
          <input class="tp-search-input" id="tp-search"
                 placeholder="搜索 token..." autocomplete="off" spellcheck="false">
        </div>
        <div class="tp-list" id="tp-list"></div>
      </div>
    </div>
  </div>

  <div class="tp-footer">
    <button class="tp-save-btn" onclick="savePickerChanges()">保存</button>
  </div>
</div>

<!-- BATCH EDITOR INLINE ALIAS DROPDOWN -->
<div id="be-vdd" class="be-vdd">
  <input id="be-vdd-search" class="be-vdd-search" placeholder="搜索 token..." autocomplete="off" spellcheck="false">
  <div id="be-vdd-list" class="be-vdd-list"></div>
</div>

<!-- BATCH EDITOR OVERLAY -->
<div class="be-overlay" id="be-overlay">
  <div class="be-panel">
    <!-- Left: collections sidebar -->
    <div class="be-sidebar" id="be-sidebar"></div>
    <!-- Right: variable table -->
    <div class="be-main">
      <div class="be-search-bar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" class="be-search-icon"><circle cx="6.5" cy="6.5" r="4"/><line x1="10" y1="10" x2="13.5" y2="13.5"/></svg>
        <input id="be-search" class="be-search-input" placeholder="搜索 Variable..." autocomplete="off" spellcheck="false" oninput="beOnSearch(this.value)">
        <button class="be-search-clear" id="be-search-clear" onclick="beOnSearch('')" title="清除">✕</button>
      </div>
      <div class="be-main-head">
        <div class="be-col-name">名称</div>
        <div class="be-col-value">值</div>
        <div class="be-col-group">Group</div>
        <div class="be-col-del"></div>
      </div>
      <div class="be-table-body" id="be-table-body"></div>
      <div class="be-add-row">
        <button class="be-add-btn" id="be-add-btn" onclick="batchAddToken()">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
          添加 Variable
        </button>
      </div>
    </div>
    <!-- Close button -->
    <button class="be-close" onclick="closeBatchEditor()" title="关闭 (Esc)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>
    </button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- PROJECT LIST OVERLAY -->
<div class="projects-overlay" id="projects-overlay" style="display:none">
  <div class="projects-page">
    <div class="projects-page-header">
      <div class="projects-page-title">我的项目</div>
      <button class="btn btn-primary" onclick="openCreateProjectModal()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
        新建项目
      </button>
    </div>
    <div class="projects-grid" id="projects-grid"></div>
  </div>
</div>

<!-- CREATE PROJECT MODAL -->
<div class="modal-bg" id="create-project-modal-bg">
  <div class="modal">
    <div class="modal-h">新建项目</div>
    <div class="field">
      <label>项目名称</label>
      <input class="fi" id="create-project-input" placeholder="例如：我的设计系统" maxlength="60" spellcheck="false" autocomplete="off">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeCreateProjectModal()">取消</button>
      <button class="btn btn-primary" onclick="submitCreateProject()">创建项目</button>
    </div>
  </div>
</div>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <div class="login-logo">
      <img src="logo.png" alt="Token Mapping" style="width:44px;height:44px;border-radius:12px;display:block;">
    </div>
    <div class="login-title">Token Mapping</div>
    <div class="login-subtitle">Design Token 配置平台<br>请登录后继续使用</div>
    <div class="login-btns">
      <a href="#" class="login-btn login-btn-github" id="login-btn-github">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub 登录
      </a>
      <a href="#" class="login-btn login-btn-google" id="login-btn-google">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google 登录
      </a>
    </div>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="main.js?v=20260319"></script>
</body>
</html>
